name: Build GeoCerca Release Assinado

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar chave de assinatura
        env:
          GEOCERCA_KEYSTORE_BASE64: ${{ secrets.GEOCERCA_KEYSTORE_BASE64 }}
        run: |
          test -n "$GEOCERCA_KEYSTORE_BASE64" || (echo "Secret GEOCERCA_KEYSTORE_BASE64 ausente" && exit 1)
          echo "$GEOCERCA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/geocerca-release.jks"

      - name: Compilar APK Release assinado
        env:
          GEOCERCA_KEYSTORE_PATH: ${{ runner.temp }}/geocerca-release.jks
          GEOCERCA_STORE_PASSWORD: ${{ secrets.GEOCERCA_STORE_PASSWORD }}
          GEOCERCA_KEY_ALIAS: ${{ secrets.GEOCERCA_KEY_ALIAS }}
          GEOCERCA_KEY_PASSWORD: ${{ secrets.GEOCERCA_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Publicar APK assinado
        uses: actions/upload-artifact@v4
        with:
          name: GeoCerca-release-assinado
          path: app/build/outputs/apk/release/app-release.apk
