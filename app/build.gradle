plugins {
    id 'com.android.application'
}

android {
    namespace 'com.geocerca.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.geocerca.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('GEOCERCA_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('GEOCERCA_STORE_PASSWORD')
                keyAlias System.getenv('GEOCERCA_KEY_ALIAS')
                keyPassword System.getenv('GEOCERCA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('GEOCERCA_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
